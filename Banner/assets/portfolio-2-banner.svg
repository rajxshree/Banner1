<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="game-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040d1a"/>
      <stop offset="50%" stop-color="#091830"/>
      <stop offset="100%" stop-color="#020710"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="neon-lime" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#game-bg)"/>

  <!-- High-tech diagonal grid -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1.5">
    <line x1="0" y1="0" x2="675" y2="675"/>
    <line x1="150" y1="0" x2="825" y2="675"/>
    <line x1="300" y1="0" x2="975" y2="675"/>
    <line x1="450" y1="0" x2="1125" y2="675"/>
    <line x1="600" y1="0" x2="1200" y2="600"/>
    <line x1="0" y1="200" x2="475" y2="675"/>
  </g>

  <!-- Large Gaming Peripheral Silhouette / Vector Graphic -->
  <g transform="translate(680, 120)">
    <!-- Glowing background ring -->
    <circle cx="220" cy="220" r="210" fill="none" stroke="url(#cyan-glow)" stroke-width="6" opacity="0.3"/>
    <circle cx="220" cy="220" r="180" fill="#0f172a" stroke="#06b6d4" stroke-width="3"/>
    
    <!-- Headset Stylized Art -->
    <path d="M 120,220 A 100,100 0 0,1 320,220" fill="none" stroke="#38bdf8" stroke-width="22" stroke-linecap="round"/>
    <rect x="95" y="200" width="50" height="90" rx="18" fill="url(#cyan-glow)"/>
    <rect x="295" y="200" width="50" height="90" rx="18" fill="url(#cyan-glow)"/>
    <circle cx="120" cy="245" r="14" fill="#ffffff" opacity="0.8"/>
    <circle cx="320" cy="245" r="14" fill="#ffffff" opacity="0.8"/>
    
    <!-- Sound pulse wave -->
    <path d="M 380,180 A 60,60 0 0,1 380,310" fill="none" stroke="#22c55e" stroke-width="6" stroke-linecap="round"/>
    <path d="M 410,150 A 100,100 0 0,1 410,340" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Content Left -->
  <g transform="translate(100, 130)">
    <rect x="0" y="0" width="180" height="34" rx="17" fill="rgba(6,182,212,0.18)" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="90" y="22" fill="#38bdf8" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="12" text-anchor="middle" letter-spacing="3">ZERO LATENCY 2.4GHZ</text>

    <text x="0" y="110" fill="#ffffff" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="62" letter-spacing="-1">APEX PRO X</text>
    <text x="0" y="175" fill="url(#cyan-glow)" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="62" letter-spacing="-1">WIRELESS AUDIO</text>

    <text x="0" y="235" fill="#94a3b8" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="500" font-size="20">Spatial 7.1 Surround • Carbon Driver • 65-Hour Battery Life</text>

    <!-- Specs Pills -->
    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="130" height="42" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
      <text x="65" y="26" fill="#ffffff" font-family="'Plus Jakarta Sans', Arial" font-weight="700" font-size="14" text-anchor="middle">0.1ms DELAY</text>

      <rect x="145" y="0" width="130" height="42" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
      <text x="210" y="26" fill="#ffffff" font-family="'Plus Jakarta Sans', Arial" font-weight="700" font-size="14" text-anchor="middle">50MM DRIVERS</text>

      <rect x="290" y="0" width="130" height="42" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
      <text x="355" y="26" fill="#ffffff" font-family="'Plus Jakarta Sans', Arial" font-weight="700" font-size="14" text-anchor="middle">RGB CHROMA</text>
    </g>

    <!-- CTA Button in Graphic -->
    <g transform="translate(0, 360)">
      <rect x="0" y="0" width="220" height="54" rx="27" fill="url(#cyan-glow)"/>
      <text x="110" y="34" fill="#040d1a" font-family="'Plus Jakarta Sans', Arial" font-weight="800" font-size="16" text-anchor="middle" letter-spacing="1">PRE-ORDER NOW</text>
    </g>
  </g>
</svg>