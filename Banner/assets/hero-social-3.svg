<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="energy-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0722"/>
      <stop offset="50%" stop-color="#3b082e"/>
      <stop offset="100%" stop-color="#0f0314"/>
    </linearGradient>
    <linearGradient id="flame-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#energy-bg)"/>

  <!-- Energy blast background spikes -->
  <g fill="rgba(249, 115, 22, 0.15)">
    <polygon points="400,500 100,0 250,0"/>
    <polygon points="400,500 650,0 800,50"/>
    <polygon points="400,500 800,400 800,600"/>
    <polygon points="400,500 700,1000 550,1000"/>
    <polygon points="400,500 250,1000 100,900"/>
    <polygon points="400,500 0,650 0,350"/>
  </g>

  <!-- Energy Can Vector Illustration -->
  <g transform="translate(320, 240) rotate(-10 80 250)">
    <!-- Can Shadow -->
    <ellipse cx="80" cy="500" rx="90" ry="25" fill="#000000" opacity="0.6"/>
    
    <!-- Can Body -->
    <rect x="0" y="60" width="160" height="420" rx="25" fill="#180424" stroke="url(#flame-grad)" stroke-width="4"/>
    <!-- Can Top Rim -->
    <ellipse cx="80" cy="60" rx="75" ry="22" fill="#cbd5e1" stroke="#94a3b8" stroke-width="3"/>
    <ellipse cx="80" cy="58" rx="60" ry="16" fill="#64748b"/>
    <rect x="72" y="44" width="16" height="26" rx="4" fill="#e2e8f0"/>

    <!-- Can Graphic Text -->
    <rect x="15" y="160" width="130" height="220" fill="url(#flame-grad)" rx="10"/>
    <text x="80" y="225" fill="#ffffff" font-family="'Plus Jakarta Sans', Arial" font-weight="900" font-size="28" text-anchor="middle" letter-spacing="2">LUMEN</text>
    <text x="80" y="260" fill="#000000" font-family="'Plus Jakarta Sans', Arial" font-weight="900" font-size="14" text-anchor="middle" letter-spacing="4">VOLT 0%</text>
    <path d="M 80,280 L 95,315 L 75,320 L 90,355 L 65,325 L 82,320 Z" fill="#ffffff"/>
  </g>

  <!-- Headlines -->
  <text x="70" y="120" fill="#f97316" font-family="'Plus Jakarta Sans', Arial" font-weight="800" font-size="15" letter-spacing="5">LIGHTNING IN A CAN</text>
  <text x="70" y="180" fill="#ffffff" font-family="'Plus Jakarta Sans', Arial" font-weight="900" font-size="56" letter-spacing="-1">UNSTOPPABLE</text>
  <text x="70" y="235" fill="url(#flame-grad)" font-family="'Plus Jakarta Sans', Arial" font-weight="900" font-size="56" letter-spacing="-1">ENERGY.</text>

  <!-- Value Badges -->
  <g transform="translate(70, 730)">
    <rect x="0" y="0" width="170" height="50" rx="25" fill="#f97316"/>
    <text x="85" y="32" fill="#ffffff" font-family="'Plus Jakarta Sans', Arial" font-weight="800" font-size="15" text-anchor="middle">200MG CAFFEINE</text>

    <rect x="190" y="0" width="150" height="50" rx="25" fill="rgba(255,255,255,0.08)" stroke="#ffffff" stroke-width="1.5"/>
    <text x="265" y="32" fill="#ffffff" font-family="'Plus Jakarta Sans', Arial" font-weight="800" font-size="15" text-anchor="middle">ZERO SUGAR</text>
  </g>

  <!-- Big Offer Bar -->
  <g transform="translate(70, 830)">
    <rect x="0" y="0" width="660" height="85" rx="20" fill="#ffffff"/>
    <text x="40" y="52" fill="#0f0314" font-family="'Plus Jakarta Sans', Arial" font-weight="900" font-size="24">GET 20% OFF FIRST PACK</text>
    
    <rect x="460" y="15" width="165" height="55" rx="14" fill="#ec4899"/>
    <text x="542" y="49" fill="#ffffff" font-family="'Plus Jakarta Sans', Arial" font-weight="800" font-size="15" text-anchor="middle">CLAIM DEAL →</text>
  </g>
</svg>