<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="matcha-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14241a"/>
      <stop offset="60%" stop-color="#0e1a12"/>
      <stop offset="100%" stop-color="#080e0a"/>
    </linearGradient>
    <linearGradient id="gold-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#matcha-bg)"/>

  <!-- Aesthetic Framing -->
  <rect x="35" y="35" width="730" height="930" fill="none" stroke="rgba(234, 179, 8, 0.25)" stroke-width="1.5"/>

  <!-- Japanese Minimal Typography -->
  <text x="70" y="100" fill="#a3e635" font-family="'Plus Jakarta Sans', Arial" font-weight="700" font-size="13" letter-spacing="5">KYOTO CEREMONIAL COLLECTION</text>
  <text x="730" y="100" fill="rgba(255,255,255,0.4)" font-family="'Plus Jakarta Sans', Arial" font-weight="600" font-size="13" text-anchor="end">抹茶 • 伝統</text>

  <!-- Central Artwork: Bowl with Whisked Matcha Foam -->
  <g transform="translate(400, 430)">
    <!-- Steam swirls -->
    <path d="M -30,-150 Q -10,-200 -20,-240" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 20,-160 Q 40,-210 25,-250" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3" stroke-linecap="round"/>

    <!-- Ceramic Bowl Base -->
    <ellipse cx="0" cy="100" rx="180" ry="40" fill="#0b110e" opacity="0.6"/>
    <path d="M -180,20 Q 0,220 180,20 Z" fill="#1b2e21" stroke="#36533f" stroke-width="3"/>
    
    <!-- Top Bowl Rim & Rich Matcha Green Liquid -->
    <ellipse cx="0" cy="20" rx="180" ry="70" fill="#16291d" stroke="#4ade80" stroke-width="2"/>
    <ellipse cx="0" cy="20" rx="160" ry="60" fill="#22c55e"/>
    
    <!-- Foam froth texture -->
    <ellipse cx="-20" cy="15" rx="100" ry="38" fill="#4ade80" opacity="0.8"/>
    <circle cx="30" cy="10" r="18" fill="#86efac" opacity="0.6"/>
    <circle cx="-50" cy="20" r="12" fill="#86efac" opacity="0.7"/>
    <circle cx="0" cy="0" r="8" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- Product Title & Tagline -->
  <text x="400" y="690" fill="#ffffff" font-family="'Plus Jakarta Sans', Arial" font-weight="900" font-size="48" text-anchor="middle" letter-spacing="-0.5">ORIGIN MATCHA</text>
  <text x="400" y="735" fill="url(#gold-leaf)" font-family="'Plus Jakarta Sans', Arial" font-weight="700" font-size="18" text-anchor="middle" letter-spacing="4">SHADE-GROWN • SINGLE ESTATE</text>
  <text x="400" y="780" fill="#94a3b8" font-family="'Plus Jakarta Sans', Arial" font-weight="500" font-size="16" text-anchor="middle">Slow stone-ground in Uji, Japan for silky vibrant richness.</text>

  <!-- Interactive Swipe Pill & Tag -->
  <g transform="translate(260, 840)">
    <rect x="0" y="0" width="280" height="50" rx="25" fill="rgba(74, 222, 128, 0.15)" stroke="#4ade80" stroke-width="1.5"/>
    <text x="140" y="31" fill="#4ade80" font-family="'Plus Jakarta Sans', Arial" font-weight="700" font-size="14" text-anchor="middle" letter-spacing="1">SWIPE TO EXPLORE RECIPES →</text>
  </g>
</svg>